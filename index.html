<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benedek Feke | Technical Portfolio</title>
    <meta name="description" content="Technical portfolio of Benedek Feke featuring brutalist editorial design, Ioskeley Mono and Syne typography, split-layout architecture, and project showcases." />
    <meta property="og:title" content="Benedek Feke | Technical Portfolio" />
    <meta property="og:description" content="Technical portfolio of Benedek Feke featuring brutalist editorial design, Ioskeley Mono and Syne typography, split-layout architecture, and project showcases." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved style and color mode before first paint to avoid a flash.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio-theme');
          root.dataset.style = localStorage.getItem('portfolio-style') || 'editorial';
          if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
